<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow field threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --sand: #FACC15; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #030303;
    color: #fff;
    font-family: Inter, system-ui, sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  /* canvas poore screen pe, sabse peeche */
  #bg { position: fixed; inset: 0; z-index: 0; display: block; }

  /* content upar */
  .hero {
    position: relative; z-index: 2;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 0 20px;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 400;
    font-size: clamp(34px, 6vw, 68px);
    line-height: 1.12;
    letter-spacing: -.01em;
    background: linear-gradient(#ffffff 0%, #d9dde2 30%, #9aa2ab 52%, #f2f4f6 74%, #b8bfc7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 2px 18px rgba(0,0,0,.9));
  }

  p.sub {
    margin-top: 22px;
    max-width: 520px;
    font-size: 15px;
    line-height: 1.65;
    color: rgba(255,255,255,.55);
    text-shadow: 0 2px 14px #000;
  }

  .cta {
    margin-top: 32px;
    padding: 12px 26px;
    border: none; border-radius: 999px;
    font: inherit; font-size: 14px; font-weight: 500;
    color: #0a0a0a; cursor: pointer;
    background: linear-gradient(145deg, #f0f2f5, #b0b5bd 50%, #767b82);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85),
                inset 0 -1px 0 rgba(0,0,0,.32),
                0 18px 44px rgba(0,0,0,.5);
    transition: filter .2s, transform .1s;
  }
  .cta:hover  { filter: brightness(1.08); }
  .cta:active { transform: scale(.98); }
  .cta:focus-visible { outline: 2px solid var(--sand); outline-offset: 3px; }

  /* refresh kiye bina naya pattern dekhne ke liye */
  .reseed {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 3;
    font: inherit; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(255,255,255,.45);
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    transition: color .2s, border-color .2s;
  }
  .reseed:hover { color: #fff; border-color: rgba(255,255,255,.22); }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="hero">
  <h1>We Enable AI<br>To Borrow Money To Trade</h1>
  <p class="sub">The secure protocol where AI agents borrow capital to execute trades.</p>
  <button class="cta">Join waitlist</button>
</div>

<button class="reseed" id="reseed">New pattern</button>

<script>
/* ================================================================
   FLOW FIELD — 3 steps:
   1. Noise se har point pe ek direction banao
   2. Particles ko us direction me behne do
   3. Peeche patli line chhodo → threads ban jaate hain
   ================================================================ */

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let W, H, particles = [], perm = [], time = 0;

/* ---------- FREEZE ---------- */
// 15 sec baad naye threads banne band. Jo bane hain wahi apna path
// pura karte hain, phir pattern permanently freeze ho jaata hai.
const FREEZE_AFTER = 7000;    // milliseconds
let startTime = 0;
let frozen = false;

/* ---------- THREAD COLOR — royal yellow / gold ---------- */
const GOLD       = '250, 204, 21';    // base
const GOLD_LIGHT = '255, 233, 163';   // sheen wale bright strands

/* ---------- FLOW KA DIRECTION ---------- */
// dono values har refresh pe naye sire se banti hain (init me).
let baseAngle = 0;   // saare strands kis taraf behte hain
let spread    = 0.85; // noise base se kitna hila sakta hai (chhota = parallel silk)

/* ---------- seeded random ----------
   Yahi wajah hai ki har refresh pe pattern alag aata hai.
   Ek fixed number daal do (jaise 12345) to har baar SAME aayega. */
function makeRandom(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- Perlin noise ----------
   Ye smooth random values deta hai. Pure random se alag —
   paas ke points ki value paas hoti hai, isliye flow smooth lagta hai. */
function buildPerm(rnd) {
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) {                 // shuffle
    const j = Math.floor(rnd() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  perm = [...p, ...p];                            // 512 lamba, wrap-around ke liye
}

const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + t * (b - a);

function grad(hash, x, y) {
  switch (hash & 3) {
    case 0: return  x + y;
    case 1: return -x + y;
    case 2: return  x - y;
    default: return -x - y;
  }
}

function noise(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y);
  const a = perm[X] + Y, b = perm[X + 1] + Y;
  return lerp(
    lerp(grad(perm[a],     x,     y), grad(perm[b],     x - 1, y),     u),
    lerp(grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1), u),
    v
  );
}

/* fbm = noise ke kai layers upar-upar. Isse fine detail aati hai. */
function fbm(x, y) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 3; i++) {
    v += noise(x * freq, y * freq) * amp;
    amp *= 0.5; freq *= 2.2;
  }
  return v;
}

/* ---------- setup ---------- */
function init(seed) {
  const rnd = makeRandom(seed);
  buildPerm(rnd);
  startTime = performance.now();
  frozen = false;
  time = rnd() * 100;          // field ka starting point bhi random
  baseAngle = rnd() * Math.PI * 2;   // har refresh pe koi bhi direction (0–360°)
  spread    = 0.5 + rnd() * 0.7;     // kabhi zyada parallel, kabhi zyada wavy

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = canvas.width  = innerWidth  * dpr;
  H = canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth  + 'px';
  canvas.style.height = innerHeight + 'px';

  ctx.fillStyle = '#030303';
  ctx.fillRect(0, 0, W, H);

  // particles — screen ke size ke hisaab se count
  const count = Math.min(4000, Math.floor(W * H / 900));
  particles = [];
  for (let i = 0; i < count; i++) particles.push(spawn(rnd));
}

function spawn(rnd = Math.random) {
  return {
    x: rnd() * W,
    y: rnd() * H,
    life: 300 + rnd() * 900,         // lambi life = lambe continuous strands
    bright: 0.5 + rnd() * rnd() * 2, // kuch strands zyada bright (gold sheen)
    light: rnd() < 0.18,             // 18% strands halke/paler gold
    dead: false
  };
}

/* ---------- har frame ---------- */
function draw() {
  requestAnimationFrame(draw);
  time += 0.0014;                    // field dheere-dheere morph hota hai

  // 15 sec pura hote hi freeze mode on
  if (!frozen && performance.now() - startTime > FREEZE_AFTER) frozen = true;

  /* Fade sirf freeze se pehle. Freeze ke baad fade band —
     isliye jo pattern bana hai wo hamesha ke liye rukа rehta hai. */
  if (!frozen) {
    ctx.fillStyle = 'rgba(3, 3, 3, 0.0035)';
    ctx.fillRect(0, 0, W, H);
  }

  const scale = 0.0007;              // zoom: kam = lambe smooth curves
  ctx.lineWidth = 0.6;

  for (const p of particles) {
    if (p.dead) continue;            // freeze ke baad khatam ho chuke threads

    const px = p.x, py = p.y;

    /* base direction fix, noise sirf thoda sa hilata hai.
       Isse saare strands ek taraf behte hain — silk jaisa. */
    const angle = baseAngle + fbm(p.x * scale, p.y * scale + time) * spread;

    p.x += Math.cos(angle) * 5.0;    // SPEED — kam waqt me pura pattern bharne ke liye
    p.y += Math.sin(angle) * 5.0;
    p.life--;

    if (p.life <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
      if (frozen) { p.dead = true; continue; }   // naya thread nahi banega
      Object.assign(p, spawn());                 // warna respawn
      continue;
    }

    const a = 0.022 * p.bright;      // har strand ki apni brightness
    ctx.strokeStyle = `rgba(${p.light ? GOLD_LIGHT : GOLD}, ${a})`;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
}

/* ---------- start ---------- */
init(Math.floor(Math.random() * 1e9));   // ← har refresh pe naya seed
draw();

document.getElementById('reseed').addEventListener('click', () => {
  init(Math.floor(Math.random() * 1e9));
});

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => init(Math.floor(Math.random() * 1e9)), 200);
});
</script>
</body>
</html>
