<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #fafaf8;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
    }
    header h1 { font-size: 2rem; letter-spacing: 2px; }
    header p  { margin-top: .4rem; font-size: .9rem; color: #aaa; font-family: sans-serif; }

    nav {
      display: flex;
      justify-content: center;
      gap: .5rem;
      padding: 1.2rem;
      background: #16213e;
    }
    nav button {
      padding: .5rem 1.4rem;
      border: 2px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #ccc;
      font-size: .9rem;
      cursor: pointer;
      font-family: sans-serif;
      transition: .2s;
    }
    nav button:hover    { border-color: #e94560; color: #fff; }
    nav button.active   { background: #e94560; color: #fff; border-color: #e94560; }

    main {
      max-width: 780px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.2rem;
      flex: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      font-family: sans-serif;
      font-size: .9rem;
      flex-wrap: wrap;
    }
    .controls label { color: #555; }
    .controls input[type=range] { width: 120px; accent-color: #e94560; }
    .controls span { min-width: 1.5rem; font-weight: bold; color: #e94560; }

    .btn {
      padding: .45rem 1.1rem;
      border: none;
      border-radius: 4px;
      background: #e94560;
      color: #fff;
      font-size: .85rem;
      cursor: pointer;
      font-family: sans-serif;
      transition: background .2s;
    }
    .btn:hover { background: #c73652; }
    .btn.secondary { background: #444; }
    .btn.secondary:hover { background: #222; }

    #output {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 1.8rem 2rem;
      line-height: 1.85;
      font-size: 1rem;
    }
    #output p + p { margin-top: 1.1rem; }
    #output.ja    { font-family: "Hiragino Kaku Gothic Pro", Meiryo, sans-serif; line-height: 2; }
    #output.hi    { font-family: "Noto Sans Devanagari", Arial, sans-serif; }

    .copy-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: .8rem;
    }
    #toast {
      display: none;
      margin-right: auto;
      color: green;
      font-family: sans-serif;
      font-size: .85rem;
      align-self: center;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-family: sans-serif;
      font-size: .78rem;
      color: #aaa;
      background: #f0f0ec;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>

<header>
  <h1>Lorem Ipsum</h1>
  <p>Placeholder text generator · English &nbsp;|&nbsp; हिन्दी &nbsp;|&nbsp; 日本語</p>
</header>

<nav>
  <button class="active" onclick="setLang('en')">English</button>
  <button onclick="setLang('hi')">हिन्दी</button>
  <button onclick="setLang('ja')">日本語</button>
</nav>

<main>
  <div class="controls">
    <label for="count">Paragraphs:</label>
    <input type="range" id="count" min="1" max="10" value="3" oninput="countVal.textContent=this.value">
    <span id="countVal">3</span>
    <button class="btn" onclick="generate()">Generate</button>
  </div>

  <div id="output"></div>

  <div class="copy-bar">
    <span id="toast">Copied!</span>
    <button class="btn secondary" onclick="copyText()">Copy Text</button>
  </div>
</main>

<footer>Lorem Ipsum &mdash; dummy text since the 1500s &nbsp;|&nbsp; &copy; 2026</footer>

<script>
const corpus = {
  en: [
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
    "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.",
    "Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam varius, turpis molestie pretium placerat, arcu ante imperdiet nunc, vel imperdiet nisi dolor sit amet lectus.",
    "Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Proin pharetra nonummy pede. Mauris et orci. Aenean nec lorem.",
    "Suspendisse potenti. Morbi interdum mollis sapien. Sed ac risus. Phasellus lacinia, magna a ullamcorper laoreet, lectus arcu pulvinar risus, vitae facilisis libero dolor a purus.",
    "Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae. Proin vel ante a orci tempus eleifend ut et magna. Lorem ipsum dolor sit amet, consectetur adipiscing elit.",
    "Vivamus luctus urna sed urna ultricies ac tempor dui sagittis. In condimentum facilisis porta. Sed nec diam eu diam mattis viverra. Nulla fringilla, orci ac euismod semper.",
    "Fusce dapibus, tellus ac cursus commodo, tortor mauris condimentum nibh, ut fermentum massa justo sit amet risus. Etiam porta sem malesuada magna mollis euismod.",
    "Donec ullamcorper nulla non metus auctor fringilla. Nullam id dolor id nibh ultricies vehicula ut id elit. Aenean eu leo quam. Pellentesque ornare sem lacinia quam.",
    "Integer posuere erat a ante venenatis dapibus posuere velit aliquet. Cras mattis consectetur purus sit amet fermentum. Cras justo odio, dapibus ac facilisis in, egestas eget quam.",
  ],
  hi: [
    "लोरेम इप्सम डोलर सिट अमेट, कंसेक्टेटुर एडिपिसिंग एलिट। सेड डू ईयुस्मोड टेम्पोर इन्सिडिडुंट उत लेबोरे एट डोलोरे मैग्ना अलिक्वा। उत एनिम एड मिनिम वेनियम, क्विस नोस्ट्रुड एक्सरसिटेशन उल्लामको लेबोरिस।",
    "दुइस ऑटे इरुरे डोलर इन रिप्रेहेंडेरिट इन वोलुप्टेट वेलिट एसे सिलुम डोलोरे यू फ्यूगियट नुल्ला पैरियातुर। एक्सेप्टेउर सिंट ओक्काएकत कुपिडेटत नॉन प्रोइडेंट।",
    "यह एक हिंदी प्रतिस्थापन पाठ है जो मुद्रण और टाइपसेटिंग उद्योग के लिए उपयोग किया जाता है। इसका उपयोग पांच सौ से अधिक वर्षों से होता आ रहा है।",
    "हिंदी भाषा में प्रतिस्थापन पाठ का उपयोग डिज़ाइनर और डेवलपर्स करते हैं ताकि वे वेबसाइट के लेआउट को प्रदर्शित कर सकें। यह पाठ सामग्री का प्रतिनिधित्व करता है।",
    "विविध प्रकार के दस्तावेज़ों में प्रतिस्थापन पाठ का उपयोग किया जाता है। इससे यह समझना आसान हो जाता है कि अंतिम सामग्री कैसी दिखेगी।",
    "संचार और प्रकाशन में, प्रतिस्थापन पाठ का उपयोग उस जगह किया जाता है जहाँ वास्तविक सामग्री अभी उपलब्ध नहीं होती। यह एक सामान्य प्रथा है।",
    "डिज़ाइन की दुनिया में, इस प्रकार के पाठ का उपयोग केवल दृश्य उद्देश्यों के लिए किया जाता है। पाठक इस पर ध्यान नहीं देते बल्कि डिज़ाइन पर ध्यान देते हैं।",
    "भारतीय भाषाओं में टाइपोग्राफी का विकास बहुत तेज़ी से हो रहा है। देवनागरी लिपि विश्व की सबसे वैज्ञानिक लिपियों में से एक मानी जाती है।",
    "हिंदी वेब सामग्री बनाते समय डिज़ाइनरों को उचित फ़ॉन्ट और लाइन स्पेसिंग का ध्यान रखना चाहिए। देवनागरी लिपि में मात्राएं महत्वपूर्ण भूमिका निभाती हैं।",
    "प्रत्येक भाषा की अपनी टाइपोग्राफिक विशेषताएं होती हैं। हिंदी में शिरोरेखा का विशेष महत्व होता है जो अक्षरों को एकजुट करती है।",
  ],
  ja: [
    "ろれむいぷすむどろーるしとあめと、こんせくてとぅらでぃぴしんぐえりと。せどどうえゆすもどてんぽりんちでぃでゅんとうとらぼれえとどろーれまぐなありくわ。",
    "吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。",
    "山路を登りながら、こう考えた。智に働けば角が立つ。情に棹させば流される。意地を通せば窮屈だ。とかくに人の世は住みにくい。",
    "春はあけぼの。やうやう白くなりゆく山際、少し明りて、紫だちたる雲の細くたなびきたる。夏は夜。月のころはさらなり、闇もなほ、蛍の多く飛びちがひたる。",
    "祇園精舎の鐘の声、諸行無常の響きあり。沙羅双樹の花の色、盛者必衰の理をあらはす。奢れる人も久からず、ただ春の夜の夢のごとし。",
    "日本語のダミーテキストは、デザインやレイアウトの確認に使用されます。実際のコンテンツが準備できていない段階でも、視覚的な完成イメージを確認できます。",
    "タイポグラフィはデザインの重要な要素です。フォントの選択、行間、文字間隔はすべて読みやすさに影響します。日本語フォントは特に複雑で美しい。",
    "情報社会において、テキストの役割はますます重要になっています。デジタルメディアでは、適切なフォントサイズと行間が読者の理解を助けます。",
    "ウェブデザインにおけるプレースホルダーテキストは、最終的なコンテンツの外観を予測するために使われます。デザイナーとクライアントの間のコミュニケーションを促進します。",
    "日本語は世界で最も複雑な文字体系の一つを持つ言語です。ひらがな、カタカナ、漢字の三つの文字体系が組み合わさって使われています。",
  ],
};

let lang = 'en';

function setLang(l) {
  lang = l;
  document.querySelectorAll('nav button').forEach((b, i) => {
    b.classList.toggle('active', ['en','hi','ja'][i] === l);
  });
  generate();
}

function generate() {
  const n = +document.getElementById('count').value;
  const pool = corpus[lang];
  const out = document.getElementById('output');
  out.className = lang;

  const chosen = [];
  const copy = [...pool];
  for (let i = 0; i < n; i++) {
    if (!copy.length) copy.push(...pool);
    const idx = Math.floor(Math.random() * copy.length);
    chosen.push(copy.splice(idx, 1)[0]);
  }
  out.innerHTML = chosen.map(p => `<p>${p}</p>`).join('');
}

function copyText() {
  const text = document.getElementById('output').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.style.display = 'inline';
    setTimeout(() => t.style.display = 'none', 2000);
  });
}

generate();
</script>
</body>
</html>
