<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | Rock, Paper, Scissors</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- ===== Header ===== -->
    <header class="header">
      <h1 class="logo-wrap">
        <img class="logo" id="logo" src="images/logo.svg" alt="Rock Paper Scissors" />
      </h1>
      <div class="score-box">
        <p class="score-label">Score</p>
        <p class="score-value" id="score">0</p>
      </div>
    </header>

    <!-- ===== Step 1: choose ===== -->
    <section class="board triangle" id="board" aria-label="Choose your move">
      <!-- choices are rendered by script.js -->
    </section>

    <!-- ===== Step 2: result ===== -->
    <section class="result hidden" id="result" aria-live="polite">
      <div class="pick">
        <p class="pick-label">You picked</p>
        <div class="pick-slot" id="player-slot"></div>
      </div>

      <div class="outcome hidden" id="outcome">
        <p class="outcome-text" id="outcome-text">You win</p>
        <button class="btn-play-again" id="play-again" type="button">Play again</button>
      </div>

      <div class="pick">
        <p class="pick-label">The house picked</p>
        <div class="pick-slot" id="house-slot"></div>
      </div>
    </section>

    <!-- ===== Footer buttons ===== -->
    <div class="footer-btns">
      <button class="btn-outline" id="toggle-mode" type="button">Bonus</button>
      <button class="btn-outline" id="open-rules" type="button">Rules</button>
    </div>
  </main>

  <!-- ===== Rules modal ===== -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="rules-title">
      <h2 class="modal-title" id="rules-title">Rules</h2>
      <img class="rules-img" id="rules-img" src="images/image-rules.svg" alt="Rules: paper beats rock, rock beats scissors, scissors beats paper" />
      <button class="btn-close" id="close-rules" type="button" aria-label="Close rules">
        <img src="images/icon-close.svg" alt="" />
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
